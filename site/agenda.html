<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha agenda — PalcoLivre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .date-obs{ color: var(--muted); font-size:12px; margin-top:3px; }
  .edit-obs-btn{ font-size:15px; cursor:pointer; padding:0 6px; }
  .delete-date-btn{ font-size:15px; cursor:pointer; padding:0 6px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="#" id="linkVoltar" class="back">← Voltar</a>
</div>

<div class="wrap" style="padding-top:10px;">
  <h2 style="font-family:'Fraunces',serif; font-size:24px; margin-bottom:16px;">Minha agenda</h2>

  <input type="date" id="inputData" class="form-input" style="margin-bottom:10px;">
  <button class="btn-primary" style="margin-top:0;" onclick="adicionarData()">+ Adicionar data livre</button>

  <div id="listaDatas" style="margin-top:24px;"></div>
  <p class="form-hint" style="text-align:center; margin-top:10px;">
    Toque na data para alternar Livre/Fechado. Toque no ✏️ para anotar detalhes,
    como dois shows no mesmo dia em horários diferentes. Toque no 🗑️ para remover
    a data da agenda.
  </p>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
const id = getQueryParam('id');
document.getElementById('linkVoltar').href = `perfil.html?id=${id}`;

document.getElementById('inputData').min = new Date().toISOString().slice(0, 10);

// Guarda a lista em memória pra poder atualizar a tela na hora (otimista),
// sem precisar recarregar tudo do servidor a cada ação.
let datasAtuais = [];

function renderLista() {
  const container = document.getElementById('listaDatas');
  const ordenadas = [...datasAtuais].sort((a, b) => a.data.localeCompare(b.data));

  if (ordenadas.length === 0) {
    container.innerHTML = '<div class="empty-msg">Nenhuma data cadastrada ainda.</div>';
    return;
  }

  container.innerHTML = ordenadas.map(d => {
    const livre = d.status === 'livre';
    return `
      <div class="date-list-card ${livre ? 'free' : ''}" style="align-items:flex-start;">
        <div style="flex:1; cursor:pointer;" onclick="alternarStatus('${d.data}')">
          <span style="font-weight:700;">${formatarDataExtenso(d.data)}</span>
          ${d.observacao ? `<div class="date-obs">${escapeHtml(d.observacao)}</div>` : ''}
        </div>
        <span class="edit-obs-btn" onclick="editarObservacao('${d.data}', ${JSON.stringify(d.observacao || '').replace(/"/g, '&quot;')}, '${d.status}')">✏️</span>
        <span class="delete-date-btn" onclick="excluirDataConfirmar('${d.data}')">🗑️</span>
        <span class="status-pill ${livre ? 'free' : ''}">${livre ? 'Livre' : 'Fechado'}</span>
      </div>`;
  }).join('');
}

async function carregar() {
  const container = document.getElementById('listaDatas');
  container.innerHTML = '<div class="loading">Carregando...</div>';

  try {
    const perfil = await buscarPerfilArtista(id);
    datasAtuais = (perfil.datas || []).map(d => ({ ...d, data: String(d.data).slice(0, 10) }));
    renderLista();
  } catch (e) {
    container.innerHTML = `<div class="empty-msg">${escapeHtml(e.message)}</div>`;
  }
}

// Adiciona na tela IMEDIATAMENTE (otimista); desfaz se o servidor recusar.
async function adicionarData() {
  const input = document.getElementById('inputData');
  if (!input.value) return mostrarToast('Escolha uma data');

  const novaData = input.value;
  if (datasAtuais.some(d => d.data === novaData)) {
    mostrarToast('Essa data já está na sua agenda.');
    return;
  }

  datasAtuais.push({ data: novaData, status: 'livre', observacao: null });
  renderLista();
  input.value = '';

  try {
    await salvarData(id, novaData, 'livre');
  } catch (e) {
    datasAtuais = datasAtuais.filter(d => d.data !== novaData);
    renderLista();
    mostrarToast(e.message || 'Não foi possível salvar a data. Tente novamente.');
  }
}

// Alterna Livre/Fechado na tela na hora; desfaz se o servidor recusar.
async function alternarStatus(data) {
  const atual = datasAtuais.find(d => d.data === data);
  if (!atual) return;

  const statusAnterior = atual.status;
  const observacaoAnterior = atual.observacao;
  const novoStatus = statusAnterior === 'livre' ? 'reservado' : 'livre';

  atual.status = novoStatus;
  atual.observacao = null; // limpa: geralmente descreve o status anterior
  renderLista();

  try {
    await salvarData(id, data, novoStatus, undefined);
  } catch (e) {
    atual.status = statusAnterior;
    atual.observacao = observacaoAnterior;
    renderLista();
    mostrarToast('Não foi possível atualizar a data. Tente novamente.');
  }
}

async function editarObservacao(data, observacaoAtual, statusAtual) {
  const texto = prompt('Observação para essa data (ex: "Show às 15h fechado, à noite livre"):', observacaoAtual || '');
  if (texto === null) return; // cancelou

  const atual = datasAtuais.find(d => d.data === data);
  const observacaoAnterior = atual ? atual.observacao : null;
  if (atual) {
    atual.observacao = texto.trim() || null;
    renderLista();
  }

  try {
    await salvarData(id, data, statusAtual, texto.trim() || undefined);
  } catch (e) {
    if (atual) {
      atual.observacao = observacaoAnterior;
      renderLista();
    }
    mostrarToast('Não foi possível salvar a observação. Tente novamente.');
  }
}

// Remove da tela na hora; restaura se o servidor recusar.
async function excluirDataConfirmar(data) {
  if (!confirm(`Remover ${formatarDataExtenso(data)} da sua agenda?`)) return;

  const atual = datasAtuais.find(d => d.data === data);
  if (!atual) return;

  datasAtuais = datasAtuais.filter(d => d.data !== data);
  renderLista();

  try {
    await excluirData(id, data);
  } catch (e) {
    datasAtuais.push(atual);
    renderLista();
    mostrarToast('Não foi possível excluir a data. Tente novamente.');
  }
}

carregar();
</script>

</body>
</html>
